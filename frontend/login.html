
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Login | Capstone Live</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>

<header class="site-header">
    <a class="brand" href="/">
        <span class="brand-mark">●</span>
        Capstone Live
    </a>
    <a href="/" class="nav-link">Home</a>
</header>

<main class="auth-layout">

    <section class="auth-info">
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Your stream.<br>Your community.</h1>
        <p>
            Join the conversation, watch your favorite
            creators, and share the moment.
        </p>
        <div class="auth-decoration">
            <span class="live-dot"></span>
            LIVE · Connect with your community
        </div>
    </section>

    <section class="auth-card">
        <h2>Welcome back</h2>
        <p class="auth-subtitle">
            Login to your Capstone Live account.
        </p>

        <form id="loginForm" data-mode="login">

            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                autocomplete="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
            >

            <p id="feedback" class="form-feedback"
               role="status" aria-live="polite"></p>

            <button type="submit"
                    class="btn btn-primary auth-submit">
                Login
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="/register">Create an account</a>
        </p>
    </section>

</main>

<script src="/static/js/auth.js"></script>
</body>
</html>
