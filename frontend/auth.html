
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Capstone Live</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>
        <h2>Capstone Live</h2>
        <nav>
            <a href="/">Home</a>
        </nav>
    </header>

    <main class="auth-layout">

        <section class="auth-card">
            <h2>Register</h2>
            <p>Create your account</p>

            <form id="registerForm">
                <label for="registerUsername">
                    Username
                </label>

                <input
                    id="registerUsername"
                    type="text"
                    minlength="3"
                    maxlength="24"
                    autocomplete="username"
                    required
                >

                <label for="registerPassword">
                    Password
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    minlength="8"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>
            </form>

            <p id="registerMessage" class="feedback"></p>
        </section>

        <section class="auth-card">
            <h2>Login</h2>
            <p>Welcome back</p>

            <form id="loginForm">
                <label for="loginUsername">
                    Username
                </label>

                <input
                    id="loginUsername"
                    type="text"
                    autocomplete="username"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Login
                </button>
            </form>

            <p id="loginMessage" class="feedback"></p>
        </section>

    </main>

    <script src="/static/js/auth.js"></script>
</body>
</html>
